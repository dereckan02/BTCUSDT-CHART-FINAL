<script>
if (!window.LightweightCharts) {
document.body.innerHTML = '<p style="padding:24px;color:#fff">차트 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</p>';
throw new Error("lightweight-charts not loaded");
}
const { createChart, CandlestickSeries, LineSeries, HistogramSeries, LineStyle, CrosshairMode } = LightweightCharts;

const TFS = [["1m","1분"],["5m","5분"],["15m","15분"],["1H","1시간"],["4H","4시간"],["1D","일"],["1W","주"]];
const REST = "https://www.okx.com/api/v5/market/";
const WS_URL = "wss://ws.okx.com:8443/ws/v5/business";
const inst = "BTC-USDT-SWAP";

// 트레이딩뷰 스크린샷에서 가져온 고정 색상
const BG = "#d1d4dc", ORANGE = "#f58b0a", BLACK = "#0b0b0d";

let bar = "1H";
try { const b = localStorage.getItem("bar"); if (TFS.some(t => t[0] === b)) bar = b; } catch (e) {}

const $ = id => document.getElementById(id);
const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
const tzShift = -new Date().getTimezoneOffset() * 60;
const toT = ms => Math.floor(ms / 1000) + tzShift;

const chart = createChart($("chart"), {
autoSize: true,
layout: { background: { color: BG }, textColor: "#9da2af", panes: { separatorColor: "#b4b8c5" }, attributionLogo: false },
grid: { vertLines: { color: "#dcdee6" }, horzLines: { color: "#dcdee6" } },
crosshair: { mode: CrosshairMode.Normal,
vertLine: { color: "#5a5f6b", labelBackgroundColor: "#1c1c1e" },
horzLine: { color: "#5a5f6b", labelBackgroundColor: "#1c1c1e" } },
rightPriceScale: { borderColor: "#c3c7d2" },
timeScale: { borderColor: "#c3c7d2", timeVisible: true, secondsVisible: false },
});
const candles = chart.addSeries(CandlestickSeries, {
upColor: ORANGE, downColor: BLACK,
borderUpColor: BLACK, borderDownColor: BLACK,
wickUpColor: BLACK, wickDownColor: BLACK,
priceLineColor: ORANGE, priceLineStyle: LineStyle.Dotted,
priceFormat: { type: "price", precision: 1, minMove: 0.1 },
});

let data = []; // 오래된 순: {t(ms), o,h,l,c,v}
let loadingMore = false, noMore = false, token = 0, isPastView = false;

/* ---------- 지표 계산 ---------- */
const closes = () => data.map(d => d.c);
function smaArr(src, n) {
const o = Array(src.length).fill(null); let s = 0;
for (let i = 0; i < src.length; i++) { s += src[i]; if (i >= n) s -= src[i - n]; if (i >= n - 1) o[i] = s / n; }
return o;
}
function emaArr(src, n) {
const o = Array(src.length).fill(null), k = 2 / (n + 1);
let cnt = 0, sum = 0, prev = null;
for (let i = 0; i < src.length; i++) {
const v = src[i]; if (v == null) continue;
if (prev == null) { sum += v; cnt++; if (cnt === n) { prev = sum / n; o[i] = prev; } }
else { prev = v * k + prev * (1 - k); o[i] = prev; }
}
return o;
}
function bbArr(src, n, mult) {
const mid = smaArr(src, n), up = Array(src.length).fill(null), lo = Array(src.length).fill(null);
for (let i = n - 1; i < src.length; i++) {
let v = 0; for (let j = i - n + 1; j <= i; j++) v += (src[j] - mid[i]) ** 2;
const sd = Math.sqrt(v / n); up[i] = mid[i] + mult * sd; lo[i] = mid[i] - mult * sd;
}
return [mid, up, lo];
}
function rsiArr(c, n) {
const o = Array(c.length).fill(null); if (c.length <= n) return o;
let g = 0, l = 0;
for (let i = 1; i <= n; i++) { const d = c[i] - c[i - 1]; if (d >= 0) g += d; else l -= d; }
g /= n; l /= n; o[n] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
for (let i = n + 1; i < c.length; i++) {
const d = c[i] - c[i - 1];
g = (g * (n - 1) + (d > 0 ? d : 0)) / n; l = (l * (n - 1) + (d < 0 ? -d : 0)) / n;
o[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
}
return o;
}
function macdArr(c, f, s, sg) {
const ef = emaArr(c, f), es = emaArr(c, s);
const m = c.map((_, i) => (ef[i] != null && es[i] != null ? ef[i] - es[i] : null));
const sig = emaArr(m, sg);
const h = m.map((v, i) => (v != null && sig[i] != null ? v - sig[i] : null));
return [h, m, sig];
}
const CALC = {
vol: () => [data.map(d => d.v)],
sma: p => [smaArr(closes(), p.period)],
ema: p => [emaArr(closes(), p.period)],
bb: p => bbArr(closes(), p.period, p.mult),
rsi: p => [rsiArr(closes(), p.period)],
macd: p => macdArr(closes(), p.fast, p.slow, p.signal),
};

/* ---------- 지표 정의 (설정 항목) ---------- */
const PAL = ["#2962ff", "#8e24aa", "#00897b", "#d81b60", "#6d4c41"];
const F = {
period: { k: "period", l: "기간", t: "num", min: 2, max: 500, step: 1 },
color: { k: "color", l: "색상", t: "color" },
width: { k: "width", l: "굵기", t: "num", min: 1, max: 4, step: 1 },
};
const DEFS = {
vol: { name: "거래량", fields: [], def: () => ({}) },
sma: { name: "이동평균 (SMA)", fields: [F.period, F.color, F.width], def: n => ({ period: 20, color: PAL[n % PAL.length], width: 2 }) },
ema: { name: "지수이동평균 (EMA)", fields: [F.period, F.color, F.width], def: n => ({ period: 20, color: PAL[(n + 2) % PAL.length], width: 2 }) },

case "bb":
return [

live.push({ ind, series: build(ind, own ? ++pane : 0) });
});

}
function fillOne(x) {

const arrs = CALC[x.ind.type](x.ind.p);
x.series.forEach((e, k) => {

arrs[k].forEach((v, i) => { if (v != null) pts.push(Object.assign({ time: toT(data[i].t) }, e.mk(v, i))); });
e.s.setData(pts);
});
}
const fill = () => live.forEach(fillOne);
function updateLast() {
const i = data.length - 1; if (i < 0) return;
live.forEach(x => {
if (x.ind.type === "msb") { x.shapes = msb(x.ind.p); return; }
const arrs = CALC[x.ind.type](x.ind.p);
x.series.forEach((e, k) => { const v = arrs[k][i]; if (v != null) e.s.update(Object.assign({ time: toT(data[i].t) }, e.mk(v, i))); });

}

}

async function loadMore() {

loadingMore = true; const my = token;

const older = rows.map(parse).reverse();

render(older.length);
} catch (e) { /* 다음 스크롤에서 재시도 */ }
finally { loadingMore = false; }
}
let loadingNewer = false, noNewer = false;
async function loadNewer() {
if (loadingNewer || noNewer || !isPastView || !data.length) return;
loadingNewer = true; const my = token;
try {
const lastT = data[data.length - 1].t;
const rows = await getJSON(`${REST}history-candles?instId=${inst}&bar=${bar}&before=${lastT}&limit=100`);
if (my !== token) return;
if (!rows || !rows.length) { noNewer = true; return; }
const newer = rows.map(parse).reverse().filter(x => x.t > lastT);

} catch (e) {}
finally { loadingNewer = false; }
}

if (r.from < 15) loadMore();
if (isPastView && r.to > data.length - 15) loadNewer();
});

let ws, pingTimer, retry;
function connect() {
clearTimeout(retry); clearInterval(pingTimer);
if (ws) { ws.onclose = null; ws.close(); }
const my = token;
ws = new WebSocket(WS_URL);
ws.onopen = () => {
ws.send(JSON.stringify({ op: "subscribe", args: [{ channel: "candle" + bar, instId: inst }] }));
pingTimer = setInterval(() => ws.readyState === 1 && ws.send("ping"), 20000);
};
ws.onmessage = ev => {
if (ev.data === "pong") return;
const m = JSON.parse(ev.data);
if (m.event === "subscribe") { setStatus(true, "실시간"); return; }
if (!m.data || my !== token || isPastView) return;
for (const r of m.data) {
const d = parse(r), last = data[data.length - 1];
if (last && d.t === last.t) data[data.length - 1] = d;
else if (!last || d.t > last.t) data.push(d);
else continue;
candles.update({ time: toT(d.t), open: d.o, high: d.h, low: d.l, close: d.c });
updateLast();
updateHeader(data.length - 1);
chk();
}
};
ws.onclose = () => { if (my === token) { setStatus(false, "재연결 중"); retry = setTimeout(connect, 2000); } };
}

/* ===== MSB-OB (EmreKb, MPL 2.0 파인스크립트 이식) ===== */
function msb(p) {
const n = data.length, L = p.len, H = data.map(d => d.h), Lo = data.map(d => d.l), C = data.map(d => d.c), O = data.map(d => d.o);
const o = { zig: [], lines: [], labels: [], boxes: [] }, hs = [], ls = [];
let trend = 1, lastUp = -1, lastDn = -1, eqL = -1, eqH = -1, market = 1, lL0, lH0;
const bear = k => O[k] > C[k], bull = k => O[k] < C[k];
const pick = (a, b, f, d) => { let r = d; const s = Math.max(0, Math.min(a, b)), e = Math.min(n - 1, Math.max(a, b)); for (let k = s; k <= e; k++) if (f(k)) r = k; return r; };
for (let i = L - 1; i < n; i++) {
let hh = -Infinity, ll = Infinity;
for (let k = i - L + 1; k <= i; k++) { hh = Math.max(hh, H[k]); ll = Math.min(ll, Lo[k]); }
const up = H[i] >= hh, dn = Lo[i] <= ll, old = trend;
trend = trend === 1 && dn ? -1 : trend === -1 && up ? 1 : trend;
let s = lastUp < 0 ? 1 : i - 1 - lastUp; if (s <= 0) s = 1;
let lv = Infinity; for (let k = Math.max(0, i - s + 1); k <= i; k++) lv = Math.min(lv, Lo[k]); if (lv === Lo[i]) eqL = i;
let s2 = lastDn < 0 ? 1 : i - 1 - lastDn; if (s2 <= 0) s2 = 1;
let hv = -Infinity; for (let k = Math.max(0, i - s2 + 1); k <= i; k++) hv = Math.max(hv, H[k]); if (hv === H[i]) eqH = i;
if (up) lastUp = i; if (dn) lastDn = i;
if (trend !== old) {
if (trend === 1) ls.push({ v: lv, i: eqL }); else hs.push({ v: hv, i: eqH });
if (p.zz && hs.length && ls.length) { const a = hs[hs.length - 1], b = ls[ls.length - 1]; o.zig.push({ i1: a.i, p1: a.v, i2: b.i, p2: b.v }); }
}
if (hs.length < 2 || ls.length < 2) continue;
const h0 = hs[hs.length - 1], h1 = hs[hs.length - 2], l0 = ls[ls.length - 1], l1 = ls[ls.length - 2];
if (lL0 === l0.v || lH0 === h0.v) continue;
let nm = market;
if (market === 1 && l0.v < l1.v && l0.v < l1.v - Math.abs(h0.v - l1.v) * p.fib) nm = -1;
else if (market === -1 && h0.v > h1.v && h0.v > h1.v + Math.abs(h1.v - l0.v) * p.fib) nm = 1;
if (nm === market) continue;
market = nm; lL0 = l0.v; lH0 = h0.v;
if (market === 1) {
o.lines.push({ i1: h1.i, i2: h0.i, p: h1.v, c: 1 });
o.labels.push({ i: Math.round((h1.i + l0.i) / 2), p: h1.v, t: "MSB", c: 1, up: 1 });
const a = pick(h1.i, l0.i, bear, l0.i), b = pick(l1.i - L, h1.i, bull, h1.i);
o.boxes.push({ i: a, top: H[a], bot: Lo[a], bull: 1, t: "Bu-OB", k: "o1", born: i }, { i: b, top: H[b], bot: Lo[b], bull: 1, t: l0.v < l1.v ? "Bu-BB" : "Bu-MB", k: "b1", born: i });
} else {
o.lines.push({ i1: l1.i, i2: l0.i, p: l1.v, c: 0 });
o.labels.push({ i: Math.round((l1.i + h0.i) / 2), p: l1.v, t: "MSB", c: 0, up: 0 });
const a = pick(l1.i, h0.i, bull, h0.i), b = pick(h1.i - L, l1.i, bear, l1.i);
o.boxes.push({ i: a, top: H[a], bot: Lo[a], bull: 0, t: "Be-OB", k: "o0", born: i }, { i: b, top: H[b], bot: Lo[b], bull: 0, t: h0.v > h1.v ? "Be-BB" : "Be-MB", k: "b0", born: i });
}
}
o.boxes = o.boxes.filter(bx => { for (let j = bx.born + 1; j < n; j++) if (bx.bull ? C[j] < bx.bot : C[j] > bx.top) return false; return true; });
const cnt = {};
o.boxes = o.boxes.reverse().filter(bx => (cnt[bx.k] = (cnt[bx.k] || 0) + 1) <= 5).reverse();
return o;
}

const BARMS = { "1m": 6e4, "5m": 3e5, "15m": 9e5, "1H": 36e5, "4H": 144e5, "1D": 864e5, "1W": 6048e5 };

function t2l(t) {
const n = data.length; if (!n) return null;
if (t <= data[0].t) return (t - data[0].t) / bms();
let a = 0, b = n - 1; while (a < b) { const m = (a + b + 1) >> 1; if (data[m].t <= t) a = m; else b = m - 1; }
return a + (t - data[a].t) / bms();
}
function l2t(l) {
const n = data.length; l = Math.round(l);
if (l <= 0) return data[0].t + l * bms();
if (l >= n - 1) return data[n - 1].t + (l - n + 1) * bms();
return data[l].t;
}
const X = t => { const l = t2l(t); return l == null ? null : ts.logicalToCoordinate(l); };
const Y = p => candles.priceToCoordinate(p);
const LX = i => ts.logicalToCoordinate(i);
const roundP = p => Math.round(p * 10) / 10;

function size() {
const r = $("chart").getBoundingClientRect(), d = window.devicePixelRatio || 1;
ov.width = r.width * d; ov.height = r.height * d; g.setTransform(d, 0, 0, d, 0, 0); dirty = true;
}
new ResizeObserver(size).observe($("chart"));

function fmtRem(ms) {
const tot = Math.max(0, Math.floor(ms / 1000));
const pad = n => String(n).padStart(2, "0");
const d = Math.floor(tot / 86400);
const h = Math.floor((tot % 86400) / 3600);
const m = Math.floor((tot % 3600) / 60);
const s = tot % 60;
if (d > 0) return `${d}d ${pad(h)}:${pad(m)}`;
if (h > 0) return `${pad(h)}:${pad(m)}:${pad(s)}`;
return `${pad(m)}:${pad(s)}`;
}

function drawMsb(x, R) {
const s = x.shapes, p = x.ind.p, col = b => (b ? p.color : p.color2);
g.setLineDash([]); g.lineWidth = 1; g.strokeStyle = "#6d7280";
s.zig.forEach(z => {
const a = LX(z.i1), b = LX(z.i2), y1 = Y(z.p1), y2 = Y(z.p2);
if (a == null || b == null || y1 == null || y2 == null) return;
g.beginPath(); g.moveTo(a, y1); g.lineTo(b, y2); g.stroke();
});
s.boxes.forEach(b => {
const x1 = LX(b.i), y1 = Y(b.top), y2 = Y(b.bot), x2 = LX(data.length - 1 + 10);
if (x1 == null || y1 == null || y2 == null || x2 == null) return;
const c = col(b.bull); g.fillStyle = c + "4d"; g.strokeStyle = c; g.lineWidth = 1;
g.fillRect(x1, y1, x2 - x1, y2 - y1); g.strokeRect(x1, y1, x2 - x1, y2 - y1);
g.fillStyle = c; g.font = "11px sans-serif"; g.textAlign = "right"; g.textBaseline = "middle"; g.fillText(b.t, x2 - 4, (y1 + y2) / 2);
});
s.lines.forEach(l => {
const a = LX(l.i1), b = LX(l.i2), y = Y(l.p); if (a == null || b == null || y == null) return;
g.strokeStyle = col(l.c); g.lineWidth = 2; g.beginPath(); g.moveTo(a, y); g.lineTo(b, y); g.stroke();
});
s.labels.forEach(l => {
const a = LX(l.i), y = Y(l.p); if (a == null || y == null) return;
g.fillStyle = col(l.c); g.font = "bold 11px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(l.t, a, y + (l.up ? -9 : 9));
});
}

function getHandles(d, R, ph) {
const pts = d.pts.map(q => ({ x: X(q.t), y: Y(q.p) }));
if (pts.some(q => q.x == null || q.y == null)) return [];
const [a, b] = pts;
switch (d.type) {
case "hline": return [{ x: R / 2, y: a.y, role: "p0y" }];
case "vline": return [{ x: a.x, y: ph / 2, role: "p0x" }];
case "rect": return [
{ x: a.x, y: a.y, role: "p0" },
{ x: b.x, y: b.y, role: "p1" },
{ x: b.x, y: a.y, role: "mix10" },
{ x: a.x, y: b.y, role: "mix01" },
];
case "long": case "short": {
const ys = Y(d.sl);
const x2 = Math.max(b.x, a.x + 80);
const list = [{ x: a.x, y: a.y, role: "p0" }, { x: x2, y: b.y, role: "p1" }];
if (ys != null) list.push({ x: a.x, y: ys, role: "sl" });
return list;
}
default: return pts.map((q, idx) => ({ x: q.x, y: q.y, role: idx === 0 ? "p0" : "p1" }));
}
}

function drawOne(d, R, ph) {
const sel = d.id === selId, pts = d.pts.map(q => ({ x: X(q.t), y: Y(q.p) }));
if (pts.some(q => q.x == null || q.y == null)) return;
const [a, b] = pts, col = d.color;
g.strokeStyle = col; g.fillStyle = col; g.lineWidth = d.width; g.setLineDash([]);
const ln = (x1, y1, x2, y2) => { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); };
const tx = (s, x, y, al, c) => { g.font = "11px sans-serif"; g.textAlign = al || "left"; g.textBaseline = "bottom"; g.fillStyle = c || col; g.fillText(s, x, y); };
const box = (x1, y1, x2, y2, c) => { g.fillStyle = c; g.fillRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1)); };
const pc = (v, base) => `${v >= 0 ? "+" : "−"}${Math.abs(v / base * 100).toFixed(2)}%`;
switch (d.type) {
case "trend": ln(a.x, a.y, b.x, b.y); break;
case "ray": { const ex = b.x >= a.x ? R + 60 : -60, k = b.x === a.x ? 0 : (b.y - a.y) / (b.x - a.x); ln(a.x, a.y, ex, a.y + k * (ex - a.x)); break; }
case "hline": ln(0, a.y, R, a.y); tx(fmt(d.pts[0].p), R - 4, a.y - 2, "right"); break;
case "vline": ln(a.x, 0, a.x, ph); break;
case "fib": {
const x1 = Math.min(a.x, b.x), x2 = Math.max(a.x, b.x, x1 + 80);
g.setLineDash([4, 4]); ln(a.x, a.y, b.x, b.y); g.setLineDash([]);
FIB.forEach(v => { const p = d.pts[1].p - (d.pts[1].p - d.pts[0].p) * v, y = Y(p); if (y == null) return; ln(x1, y, x2, y); tx(`${v} (${fmt(p)})`, x1 + 4, y - 2); });
break;
}
case "long": case "short": {
const ys = Y(d.sl); if (ys == null) break;
const x1 = a.x, x2 = Math.max(b.x, a.x + 80), e = d.pts[0].p, tp = d.pts[1].p;
box(x1, a.y, x2, b.y, "#1faa5933"); box(x1, a.y, x2, ys, "#e5484d33");
ln(x1, a.y, x2, a.y); g.strokeStyle = "#1faa59"; ln(x1, b.y, x2, b.y); g.strokeStyle = "#e5484d"; ln(x1, ys, x2, ys);
tx(`익절 ${fmt(tp)} (${pc(tp - e, e)})`, x1 + 4, b.y - 2, "left", "#1faa59");
tx(`손절 ${fmt(d.sl)} (${pc(d.sl - e, e)})`, x1 + 4, ys - 2, "left", "#e5484d");
tx(`진입 ${fmt(e)} · 손익비 ${(Math.abs(tp - e) / Math.abs(e - d.sl) || 0).toFixed(1)}`, x1 + 4, a.y - 2);
break;
}
case "prange": {
box(a.x, a.y, b.x, b.y, col + "22"); ln(b.x, a.y, b.x, b.y);
const df = d.pts[1].p - d.pts[0].p, bars = Math.round(Math.abs(t2l(d.pts[1].t) - t2l(d.pts[0].t)));
tx(`${df >= 0 ? "+" : "−"}${fmt(Math.abs(df))} (${pc(df, d.pts[0].p)}) · ${bars}봉`, Math.min(a.x, b.x) + 4, Math.min(a.y, b.y) - 2);
break;
}
case "rect": box(a.x, a.y, b.x, b.y, col + "33"); g.strokeStyle = col; g.strokeRect(Math.min(a.x, b.x), Math.min(a.y, b.y), Math.abs(b.x - a.x), Math.abs(b.y - a.y)); break;
}
if (d.alarm) tx("🔔", a.x + 6, a.y - 6);
if (sel) {
const hs = getHandles(d, R, ph);
hs.forEach(q => { g.beginPath(); g.arc(q.x, q.y, 6, 0, 7); g.fillStyle = "#fff"; g.fill(); g.strokeStyle = col; g.lineWidth = 2; g.stroke(); });
}
}

function drawCountdown(W, R, ph) {
if (!data.length) return;
const last = data[data.length - 1];
const py = Y(last.c);
const pw = W - R;
if (py == null || pw < 20 || py < -10 || py > ph + 10) return;
const rem = Math.max(0, last.t + bms() - Date.now());
const txt = fmtRem(rem);
const up = last.c >= last.o;
const bg = up ? ORANGE : BLACK;
const fg = up ? BLACK : "#ffffff";
const boxH = 16;
const boxY = Math.min(ph - boxH - 1, Math.max(1, py + 10));
g.save();
g.beginPath();
g.rect(R, 0, pw, ph);
g.clip();
g.fillStyle = bg;
g.fillRect(R + 1, boxY, pw - 2, boxH);
g.fillStyle = fg;
g.font = "600 11px -apple-system, 'Apple SD Gothic Neo', sans-serif";
g.textAlign = "center";
g.textBaseline = "middle";
g.fillText(txt, R + pw / 2, boxY + boxH / 2 + 0.5);
g.restore();
}

function draw() {
const W = $("chart").clientWidth, Ht = $("chart").clientHeight; g.clearRect(0, 0, W, Ht);
let pw = 0, ph = Ht;
try { pw = chart.priceScale("right").width(); ph = chart.panes()[0].getHeight(); } catch (e) {}
const R = W - pw;
g.save(); g.beginPath(); g.rect(0, 0, R, ph); g.clip();
live.forEach(x => x.shapes && drawMsb(x, R));
drawings.forEach(d => drawOne(d, R, ph));
pend.forEach(q => { const x = X(q.t), y = Y(q.p); if (x == null || y == null) return; g.beginPath(); g.arc(x, y, 5, 0, 7); g.fillStyle = ORANGE; g.fill(); });
g.restore();
drawCountdown(W, R, ph);
}
let sig = "";
(function loop() {
const r = ts.getVisibleLogicalRange();
const sec = Math.floor(Date.now() / 1000);
const s = [r && r.from.toFixed(2), r && r.to.toFixed(2), Y(0), Y(1e5), $("chart").clientWidth, data.length, data.length && data[data.length - 1].c, selId, pend.length, live.length, sec].join("|");
if (s !== sig || dirty) { sig = s; dirty = false; draw(); }
requestAnimationFrame(loop);
})();

/* 선택 바 UI */

const barEl = $("selBar");
const d = selId != null ? drawings.find(x => x.id === selId) : null;
if (!d || tool) { barEl.hidden = true; return; }
$("selName").textContent = TOOLS[d.type].name;
const al = $("selAlarm");
al.textContent = d.alarm ? "🔔 켜짐" : "🔕 알람";
al.classList.toggle("on", !!d.alarm);
barEl.hidden = false;
}

}

d.alarm = !d.alarm;
if (d.alarm) { unlock(); try { window.Notification && Notification.permission === "default" && Notification.requestPermission(); } catch (e) {} }
saveD(); keepAwake(); dirty = true; syncSelBar();
};

openDrawSheet();
};

/* 그리기: 탭으로 점 찍기 */
function setHint(t) { $("hint").hidden = !t; $("hintTx").textContent = t || ""; }
function startTool(k) {
tool = k; pend = []; setSelected(null); ov.classList.add("on"); closeSheet();
setHint(TOOLS[k].n === 1 ? "차트를 탭해서 위치를 정하세요" : "차트를 탭해서 첫 번째 점을 정하세요"); dirty = true;
}
function cancelTool() { tool = null; pend = []; ov.classList.remove("on"); setHint(""); dirty = true; }
$("hintX").onclick = cancelTool;
function finishDraw() {
const T = TOOLS[tool], d = { id: Date.now(), type: tool, pts: pend, color: T.col, width: 2, alarm: false };
if (tool === "long" || tool === "short") { const e = pend[0].p, tp = pend[1].p; d.sl = Math.round((e - (tp - e) / 2) * 10) / 10; }
drawings.push(d); saveD(); cancelTool(); setSelected(d.id);
}
let dn = null;
ov.addEventListener("pointerdown", e => { dn = { x: e.clientX, y: e.clientY }; });
ov.addEventListener("pointerup", e => {
if (!tool || !dn) return;
const moved = Math.hypot(e.clientX - dn.x, e.clientY - dn.y); dn = null; if (moved > 12) return;
const r = ov.getBoundingClientRect(), l = ts.coordinateToLogical(e.clientX - r.left), pr = candles.coordinateToPrice(e.clientY - r.top);
if (l == null || pr == null || !data.length) return;
pend.push({ t: l2t(l), p: roundP(pr) }); dirty = true;
if (pend.length >= TOOLS[tool].n) finishDraw(); else setHint("두 번째 점을 탭하세요");
});

/* 그려 둔 도구 히트 테스트 & 트레이딩뷰식 드래그 이동/리사이즈 */
function seg(px, py, x1, y1, x2, y2) {
const dx = x2 - x1, dy = y2 - y1, l = dx * dx + dy * dy; let t = l ? ((px - x1) * dx + (py - y1) * dy) / l : 0; t = Math.max(0, Math.min(1, t));
return Math.hypot(px - x1 - t * dx, py - y1 - t * dy);
}
function hitOne(d, x, y) {
const pts = d.pts.map(q => ({ x: X(q.t), y: Y(q.p) }));
if (pts.some(q => q.x == null || q.y == null)) return false;
const [a, b] = pts;
switch (d.type) {
case "trend": return seg(x, y, a.x, a.y, b.x, b.y) < 16;
case "ray": return seg(x, y, a.x, a.y, a.x + (b.x - a.x) * 1000, a.y + (b.y - a.y) * 1000) < 16;
case "hline": return Math.abs(y - a.y) < 16;
case "vline": return Math.abs(x - a.x) < 16;
default: {
const ys = [a.y, b.y]; if (d.sl != null && Y(d.sl) != null) ys.push(Y(d.sl));
const x2 = d.type === "long" || d.type === "short" ? Math.max(a.x, b.x, a.x + 80) : Math.max(a.x, b.x);
return x >= Math.min(a.x, b.x) - 10 && x <= x2 + 10 && y >= Math.min(...ys) - 10 && y <= Math.max(...ys) + 10;
}
}
}
function hit(x, y) {
for (let k = drawings.length - 1; k >= 0; k--) {
if (hitOne(drawings[k], x, y)) return drawings[k];
}
return null;
}

function getPlotDim() {
const W = $("chart").clientWidth, Ht = $("chart").clientHeight;
let pw = 0, ph = Ht;
try { pw = chart.priceScale("right").width(); ph = chart.panes()[0].getHeight(); } catch (e) {}
return { R: W - pw, ph };
}

let drag = null;
const chartEl = $("chart");

chartEl.addEventListener("pointerdown", e => {
if (tool || !data.length) return;
if (e.target.closest("#selBar, #hint, #err")) return;
if (selId == null) return;
const d = drawings.find(x => x.id === selId);
if (!d) return;
const r = chartEl.getBoundingClientRect();
const x = e.clientX - r.left, y = e.clientY - r.top;
const { R, ph } = getPlotDim();
if (x > R || y > ph) return;

let role = null;
const hs = getHandles(d, R, ph);
let best = 20;
for (const h of hs) {
const dist = Math.hypot(x - h.x, y - h.y);
if (dist < best) { best = dist; role = h.role; }
}
if (!role && hitOne(d, x, y)) role = "move";
if (!role) return;

const startL = ts.coordinateToLogical(x);
const startP = candles.coordinateToPrice(y);
if (startL == null || startP == null) return;

e.stopPropagation();
e.preventDefault();
chart.applyOptions({ handleScroll: false, handleScale: false });
drag = {
d, role,
startL, startP,
origPts: d.pts.map(q => ({ t: q.t, l: t2l(q.t), p: q.p })),
origSl: d.sl,
moved: false,
pid: e.pointerId,
};
try { chartEl.setPointerCapture(e.pointerId); } catch (_) {}
}, { capture: true });

chartEl.addEventListener("pointermove", e => {
if (!drag) {
if (!tool && selId != null && e.pointerType === "mouse") {
const d = drawings.find(x => x.id === selId);
if (d) {
const r = chartEl.getBoundingClientRect();
const x = e.clientX - r.left, y = e.clientY - r.top;
const { R, ph } = getPlotDim();
const onH = getHandles(d, R, ph).some(h => Math.hypot(x - h.x, y - h.y) < 16);
chartEl.style.cursor = onH ? "pointer" : hitOne(d, x, y) ? "move" : "";
}
}
return;
}
if (e.pointerId !== drag.pid) return;
const r = chartEl.getBoundingClientRect();
const x = e.clientX - r.left, y = e.clientY - r.top;
const curL = ts.coordinateToLogical(x);
const curP = candles.coordinateToPrice(y);
if (curL == null || curP == null) return;

const dl = Math.round(curL - drag.startL);
const dp = curP - drag.startP;
if (dl !== 0 || Math.abs(dp) > 0.05) drag.moved = true;

const d = drag.d, o = drag.origPts;
switch (drag.role) {
case "move":
d.pts.forEach((q, i) => { q.t = l2t(o[i].l + dl); q.p = roundP(o[i].p + dp); });
if (drag.origSl != null) d.sl = roundP(drag.origSl + dp);
break;
case "p0":
d.pts[0].t = l2t(o[0].l + dl); d.pts[0].p = roundP(o[0].p + dp);
break;
case "p1":
d.pts[1].t = l2t(o[1].l + dl); d.pts[1].p = roundP(o[1].p + dp);
break;
case "p0y":
d.pts[0].p = roundP(o[0].p + dp);
break;
case "p0x":
d.pts[0].t = l2t(o[0].l + dl);
break;
case "mix10":
d.pts[1].t = l2t(o[1].l + dl); d.pts[0].p = roundP(o[0].p + dp);
break;
case "mix01":
d.pts[0].t = l2t(o[0].l + dl); d.pts[1].p = roundP(o[1].p + dp);
break;
case "sl":
d.sl = roundP(drag.origSl + dp);
break;
}
dirty = true;
});

function endDrag(e) {
if (!drag) return;
if (e && drag.pid != null && e.pointerId !== drag.pid) return;
const wasMoved = drag.moved;
try { chartEl.releasePointerCapture(drag.pid); } catch (_) {}
drag = null;
chartEl.style.cursor = "";
chart.applyOptions({ handleScroll: true, handleScale: true });
if (wasMoved) saveD();
dirty = true;
}
chartEl.addEventListener("pointerup", endDrag);
chartEl.addEventListener("pointercancel", endDrag);

chart.subscribeClick(p => {
if (tool || drag || !p.point) return;
const d = hit(p.point.x, p.point.y);
if (d) setSelected(d.id);
else if (selId != null) setSelected(null);
});

/* 그리기 시트 */
function openDrawSheet() { $("backdrop").hidden = false; $("dsheet").hidden = false; $("sheet").hidden = true; renderDraw(); }
$("penBtn").onclick = () => { if (tool) cancelTool(); openDrawSheet(); };
$("closeD").onclick = closeSheet;
$("clrD").onclick = () => { drawings = []; setSelected(null); openD = null; saveD(); keepAwake(); renderDraw(); };
function fld(form, text, type, val, onch, attrs) {
const lab = el("label"), sp = el("span"), inp = document.createElement("input");
sp.textContent = text; inp.type = type; inp.value = val; Object.assign(inp, attrs || {});
inp.addEventListener(type === "color" ? "input" : "change", () => onch(inp)); lab.append(sp, inp); form.append(lab);
}
function renderDraw() {
const t = $("tiles");
if (!t.children.length) Object.keys(TOOLS).forEach(k => {
const b = el("button", "tile");
b.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">${TOOLS[k].ic}</svg><span>${TOOLS[k].name}</span>`;
b.onclick = () => startTool(k); t.append(b);
});
const list = $("dList"); list.textContent = "";
if (!drawings.length) { const p = el("p", "empty"); p.textContent = "아직 그린 게 없어요. 위에서 도구를 골라 차트를 탭해 보세요."; list.append(p); }
drawings.forEach(d => {
const T = TOOLS[d.type], row = el("div", "irow"), head = el("div", "ihead");
const dot = el("span", "dot"); dot.style.background = d.color;
const name = el("span", "iname");
name.textContent = `${T.name} ${d.type === "vline" ? new Date(d.pts[0].t).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : fmt(d.pts[0].p)}`;
const bell = el("button", "bell" + (d.alarm ? " on" : "")); bell.textContent = d.alarm ? "🔔 켜짐" : "🔕 꺼짐";
const bSet = el("button", "mini"); bSet.textContent = "설정";
const bDel = el("button", "mini danger"); bDel.textContent = "삭제";
head.append(dot, name, bell, bSet, bDel);
const form = el("div", "iform"); form.hidden = d.id !== openD;

function levels(d, now) {

case "fib": return FIB.map(v => ({ p: P(1) - (P(1) - P(0)) * v, n: v + " 레벨" }));
case "long": case "short": return [{ p: P(0), n: "진입가" }, { p: P(1), n: "익절가" }, { p: d.sl, n: "손절가" }];
default: return [{ p: P(0) }, { p: P(1) }];
}
}

/* ===== BB + MSB-OB 백테스트 ===== */
function calcMsbSignals(len, fib, bravoMode, fib05Mode) {
const n = data.length, H = data.map(d => d.h), Lo = data.map(d => d.l), C = data.map(d => d.c);
const hs = [], ls = [], sigs = [];
let trend = 1, lastUp = -1, lastDn = -1, eqL = -1, eqH = -1, market = 1, lL0, lH0;
for (let i = len - 1; i < n; i++) {
let hh = -Infinity, ll = Infinity;
for (let k = i - len + 1; k <= i; k++) { hh = Math.max(hh, H[k]); ll = Math.min(ll, Lo[k]); }
const up = H[i] >= hh, dn = Lo[i] <= ll, old = trend;
trend = trend === 1 && dn ? -1 : trend === -1 && up ? 1 : trend;
let s = lastUp < 0 ? 1 : i - 1 - lastUp; if (s <= 0) s = 1;
let lv = Infinity; for (let k = Math.max(0, i - s + 1); k <= i; k++) lv = Math.min(lv, Lo[k]); if (lv === Lo[i]) eqL = i;
let s2 = lastDn < 0 ? 1 : i - 1 - lastDn; if (s2 <= 0) s2 = 1;
let hv = -Infinity; for (let k = Math.max(0, i - s2 + 1); k <= i; k++) hv = Math.max(hv, H[k]); if (hv === H[i]) eqH = i;
if (up) lastUp = i; if (dn) lastDn = i;
if (trend !== old) { if (trend === 1) ls.push({ v: lv, i: eqL }); else hs.push({ v: hv, i: eqH }); }
if (hs.length < 2 || ls.length < 2) continue;
const h0 = hs[hs.length - 1], h1 = hs[hs.length - 2], l0 = ls[ls.length - 1], l1 = ls[ls.length - 2];
if (lL0 === l0.v || lH0 === h0.v) continue;
let nm = market;
if (market === 1 && l0.v < l1.v && l0.v < l1.v - Math.abs(h0.v - l1.v) * fib) nm = -1;
else if (market === -1 && h0.v > h1.v && h0.v > h1.v + Math.abs(h1.v - l0.v) * fib) nm = 1;
if (nm === market) continue;
market = nm; lL0 = l0.v; lH0 = h0.v;
if (market === 1) {
if (!bravoMode || l0.v < l1.v) {
if (fib05Mode) {
sigs[i] = { dir: "long", sl: l0.v, limit: (l0.v + h0.v) / 2, inv: l0.v };
} else {
let trig = i;
for (let k = Math.max(h1.i + 1, l0.i); k <= h0.i; k++) { if (C[k] > h1.v) { trig = k; break; } }
if (trig === i) for (let k = Math.max(h1.i + 1, l0.i); k <= h0.i; k++) { if (H[k] > h1.v) { trig = k; break; } }
sigs[trig] = { dir: "long", sl: l0.v };
}
}
} else {
if (!bravoMode || h0.v > h1.v) {
if (fib05Mode) {
sigs[i] = { dir: "short", sl: h0.v, limit: (h0.v + l0.v) / 2, inv: h0.v };
} else {
let trig = i;
for (let k = Math.max(l1.i + 1, h0.i); k <= l0.i; k++) { if (C[k] < l1.v) { trig = k; break; } }
if (trig === i) for (let k = Math.max(l1.i + 1, h0.i); k <= l0.i; k++) { if (Lo[k] < l1.v) { trig = k; break; } }
sigs[trig] = { dir: "short", sl: h0.v };
}
}
}
}
return sigs;
}

function runBacktest() {
const bbLen = Math.max(10, Math.min(500, Number($("btBbLen").value) || 300));
const bbMult = Math.max(0.5, Math.min(5, Number($("btBbMult").value) || 2));
const msbLen = Math.max(2, Math.min(100, Number($("btMsbLen").value) || 9));
const fib = Math.max(0, Math.min(1, Number($("btFib").value) || 0.33));
const rrRaw = $("btRR").value;
const isPctBe = rrRaw === "pct_2_1_be";
const isPct21 = rrRaw === "pct_2_1" || isPctBe;
const rr = isPct21 ? 0.5 : (Number(rrRaw) || 0.5);
const sideFilter = $("btSide").value;
const feePct = Math.max(0, Number($("btFee").value) || 0) / 100;

if (data.length <= bbLen + 5) {
$("btInfo").textContent = `데이터가 ${data.length}봉이라 BB(${bbLen}) 계산에 부족합니다. 상단 버튼을 눌러 과거 데이터를 더 불러와 주세요.`;
return;
}

const [mid, up, lo] = bbArr(closes(), bbLen, bbMult);
const modeVal = $("btMode").value;
const bravoMode = modeVal === "bravo" || modeVal === "bravo_fib";
const fib05Mode = modeVal === "bravo_fib";
const sigs = calcMsbSignals(msbLen, fib, bravoMode, fib05Mode);
const trades = [];
let bullArm = false, bearArm = false;
let pos = null, pendOrd = null;

for (let i = bbLen - 1; i < data.length - 1; i++) {
const d = data[i];
if (pos) {
if (pos.dir === "long") {
if (d.l <= pos.sl) {
pos.exitIdx = i;
if (pos.halfDone) { pos.exitPx = (pos.halfTp + pos.sl) / 2; pos.res = "win"; pos.beExit = true; }
else { pos.exitPx = pos.sl; pos.res = "loss"; }
trades.push(pos); pos = null;
} else {
if (pos.be && !pos.halfDone && d.h >= pos.halfTp) { pos.halfDone = true; pos.sl = pos.entry; }
if (d.h >= pos.tp) {
pos.exitIdx = i;
pos.exitPx = pos.be ? (pos.halfTp + pos.tp) / 2 : pos.tp;
pos.res = "win"; trades.push(pos); pos = null;
}
}
} else {
if (d.h >= pos.sl) {
pos.exitIdx = i;
if (pos.halfDone) { pos.exitPx = (pos.halfTp + pos.sl) / 2; pos.res = "win"; pos.beExit = true; }
else { pos.exitPx = pos.sl; pos.res = "loss"; }
trades.push(pos); pos = null;
} else {
if (pos.be && !pos.halfDone && d.l <= pos.halfTp) { pos.halfDone = true; pos.sl = pos.entry; }
if (d.l <= pos.tp) {
pos.exitIdx = i;
pos.exitPx = pos.be ? (pos.halfTp + pos.tp) / 2 : pos.tp;
pos.res = "win"; trades.push(pos); pos = null;
}
}
}
}

if (!pos && pendOrd) {
if (pendOrd.dir === "long") {
if (d.l <= pendOrd.inv) { pendOrd = null; }
else if (d.l <= pendOrd.limit) {
const entry = Math.min(d.o, pendOrd.limit);
const sl = isPct21 ? entry * 0.98 : pendOrd.sl;
const tp = isPct21 ? entry * 1.01 : entry + (entry - sl) * rr;
const risk = entry - sl;
if (risk > 0) pos = { dir: "long", idx: i, t: d.t, entry, sl, tp, risk, be: isPctBe, halfDone: false, halfTp: entry * 1.005 };
pendOrd = null;
}
} else {
if (d.h >= pendOrd.inv) { pendOrd = null; }
else if (d.h >= pendOrd.limit) {
const entry = Math.max(d.o, pendOrd.limit);
const sl = isPct21 ? entry * 1.02 : pendOrd.sl;
const tp = isPct21 ? entry * 0.99 : entry - (sl - entry) * rr;
const risk = sl - entry;
if (risk > 0) pos = { dir: "short", idx: i, t: d.t, entry, sl, tp, risk, be: isPctBe, halfDone: false, halfTp: entry * 0.995 };
pendOrd = null;
}
}
}

const bodyTop = Math.max(d.o, d.c), bodyBot = Math.min(d.o, d.c);
if (lo[i] != null && bodyBot < lo[i]) { bullArm = true; bearArm = false; }
if (up[i] != null && bodyTop > up[i]) { bearArm = true; bullArm = false; }

const sg = sigs[i];
if (!sg) continue;
if (sg.dir === "long") {
const notOverbought = up[i] == null || bodyTop < up[i];
if (!pos && bullArm && notOverbought && (sideFilter === "all" || sideFilter === "long")) {
if (fib05Mode) {
pendOrd = { dir: "long", limit: sg.limit, sl: sg.sl, inv: sg.inv };
} else {
const entry = d.c;
const sl = isPct21 ? entry * 0.98 : sg.sl;
const tp = isPct21 ? entry * 1.01 : entry + (entry - sl) * rr;
const risk = entry - sl;
if (risk > 0) pos = { dir: "long", idx: i, t: d.t, entry, sl, tp, risk, be: isPctBe, halfDone: false, halfTp: entry * 1.005 };
}
} else if (pendOrd && pendOrd.dir === "short") { pendOrd = null; }
bullArm = false;
} else {
const notOversold = lo[i] == null || bodyBot > lo[i];
if (!pos && bearArm && notOversold && (sideFilter === "all" || sideFilter === "short")) {
if (fib05Mode) {
pendOrd = { dir: "short", limit: sg.limit, sl: sg.sl, inv: sg.inv };
} else {
const entry = d.c;
const sl = isPct21 ? entry * 1.02 : sg.sl;
const tp = isPct21 ? entry * 0.99 : entry - (sl - entry) * rr;
const risk = sl - entry;
if (risk > 0) pos = { dir: "short", idx: i, t: d.t, entry, sl, tp, risk, be: isPctBe, halfDone: false, halfTp: entry * 0.995 };
}
} else if (pendOrd && pendOrd.dir === "long") { pendOrd = null; }
bearArm = false;
}
}
if (pos) { pos.res = "open"; pos.exitPx = data[data.length - 1].c; trades.push(pos); }

const closed = trades.filter(t => t.res !== "open");
const wins = closed.filter(t => t.res === "win").length;
const losses = closed.filter(t => t.res === "loss").length;
const wr = closed.length ? (wins / closed.length * 100) : 0;
const beWr = (1 / (1 + rr)) * 100;

const szMode = $("btSize").value;
const rmSizes = szMode === "rm_5" ? [0.05, 0.025, 0.01] : [0.10, 0.05, 0.025, 0.01];
let eqR = 0, peakR = 0, mddR = 0, sumPct = 0;
let seed = 1000, peakSeed = 1000, mddSeed = 0, lossStreak = 0;
closed.forEach(t => {
const grossPct = t.dir === "long" ? (t.exitPx - t.entry) / t.entry : (t.entry - t.exitPx) / t.entry;
const rawR = (grossPct * t.entry) / t.risk;
const feeR = (feePct * t.entry) / t.risk;
const netR = rawR - feeR;
eqR += netR;
if (eqR > peakR) peakR = eqR;
if (peakR - eqR > mddR) mddR = peakR - eqR;
const pct = grossPct - feePct;
sumPct += pct * 100;
t.netR = netR;
t.netPct = pct * 100;
const m = szMode.startsWith("rm_") ? rmSizes[Math.min(lossStreak, rmSizes.length - 1)] : (Number(szMode.split("_")[1]) || 3) / 100;
seed = Math.max(0, seed * (1 + pct * (m * 100)));
if (seed > peakSeed) peakSeed = seed;
const dd = peakSeed > 0 ? (peakSeed - seed) / peakSeed * 100 : 0;
if (dd > mddSeed) mddSeed = dd;
lossStreak = t.res === "win" ? 0 : lossStreak + 1;
});
const seedRoi = (seed / 1000 - 1) * 100;

const tfName = (TFS.find(x => x[0] === bar) || [bar, bar])[1];
const startStr = new Date(data[bbLen - 1].t).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
$("btInfo").textContent = `${tfName} · 유효 구간 ${data.length - bbLen}봉 (${startStr} ~ 현재, 전체 ${data.length}봉 로드됨)`;

const kpi = $("btKpi");
kpi.innerHTML = `
<div class="bt-kpi"><div class="k">총 거래 (승 / 패)</div><div class="v">${closed.length}회 <span style="font-size:13px;font-weight:500;color:#a8adb8">(${wins}승 ${losses}패)</span></div></div>
<div class="bt-kpi"><div class="k">승률 (손익분기 ${beWr.toFixed(1)}%)</div><div class="v ${wr >= beWr ? "pos" : "neg"}">${wr.toFixed(1)}%</div></div>
<div class="bt-kpi"><div class="k">$1,000 복리 잔고</div><div class="v ${seed >= 1000 ? "pos" : "neg"}">$${seed.toLocaleString("en-US", {maximumFractionDigits:0})} <span style="font-size:12px">(${seedRoi >= 0 ? "+" : ""}${seedRoi.toFixed(1)}%)</span></div></div>
<div class="bt-kpi"><div class="k">누적 손익 / 시드 MDD</div><div class="v ${eqR >= 0 ? "pos" : "neg"}">${eqR >= 0 ? "+" : ""}${eqR.toFixed(1)}R <span style="font-size:12px;color:#ff7a70">(-${mddSeed.toFixed(1)}%)</span></div></div>
`;

const list = $("btList"); list.textContent = "";
$("btListH").hidden = !trades.length;
if (!trades.length) {
const p = el("p", "empty"); p.textContent = "해당 구간에서 조건에 맞는 진입 신호가 없었습니다."; list.append(p);
return;

trades.slice().reverse().forEach(t => {

});
}

} catch (e) {
btn.textContent = "불러오기 실패: " + e.message;
setTimeout(() => { btn.textContent = "해당 날짜로 이동"; }, 2000);
} finally {
btn.disabled = false;
if (btn.textContent === "차트 불러오는 중...") btn.textContent = "해당 날짜로 이동";
}
};

size(); mark(); rebuild(); load(); keepAwake();
</script>
</body>
</html>
